# mem's heartbeat: runs every 5 minutes on GitHub's free runners (free for public repos).
# mem's memory and public feed live on the "data" branch: data/public/feed.json is what the site reads.
name: mem
on:
  schedule:
    - cron: '2-59/5 * * * *'   # every 5 minutes, off the busy top of the hour
  workflow_dispatch: {}        # "Run workflow" button for a manual tick
concurrency:
  group: mem
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Load mem's memory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            git clone -q --depth 1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
          elif [ $code -eq 2 ]; then
            echo "first run: mem has no memory yet"; mkdir -p data
          else
            echo "could not reach mem's memory, stopping so nothing is overwritten"; exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Reuse installed packages
        id: deps
        uses: actions/cache@v5
        with:
          path: node_modules
          key: deps-${{ hashFiles('package.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund
      - name: mem's tick
        run: npx tsx src/tick.ts
        env:
          DATA_DIR: data
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          EXCLUDE_WALLETS: ${{ secrets.EXCLUDE_WALLETS }}
          MEM_MINT: ${{ vars.MEM_MINT }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          FIRST_TRIP_SOL: ${{ vars.FIRST_TRIP_SOL }}
          MIN_DROP_SOL: ${{ vars.MIN_DROP_SOL }}
          TOP_N: ${{ vars.TOP_N }}
      - name: Save mem's memory
        if: always()
        run: |
          [ -s data/state.json ] || { echo "no memory to save"; exit 0; }
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "mem"
          git config user.email "mem@users.noreply.github.com"
          git add -A
          git commit -qm "mem $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
